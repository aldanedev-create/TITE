# Tite CLI Application Configuration
# This file is automatically generated by Tite

[project]
name = "{{ project_name }}"
version = "0.1.0"
description = "{{ project_description }}"
author = "{{ author_name }}"
email = "{{ author_email }}"
python_version = ">=3.9"

[dev]
command = "python -m app.main"
port = 8000
host = "127.0.0.1"
env_file = ".env"
env_prefix = "APP_"

[watcher]
paths = ["src", "tests"]
extensions = [".py", ".json", ".yaml", ".yml", ".toml"]
ignore = [
    ".venv",
    "__pycache__",
    "*.egg-info",
    "logs",
    "*.log",
    "build",
    "dist",
]
debounce = 100
restart_on_change = true

[clean]
include = [
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    ".hypothesis",
    ".tox",
    ".nox",
    "build",
    "dist",
    "*.egg-info",
    "*.pyc",
    "*.pyo",
    "*.pyd",
    "*.so",
    "*.log",
    "*.pid",
    "*.pid.lock",
]
exclude = [
    ".venv",
    "venv",
]

[git]
init = true
remote_url = "https://github.com/{{ github_username }}/{{ project_name }}.git"
branch = "main"
ignore_patterns = [
    ".venv",
    "__pycache__",
    "*.pyc",
    ".env",
    ".env.local",
    ".env.*.local",
    "dist",
    "build",
    "*.egg-info",
    "*.log",
    "*.db",
    "*.sqlite",
    "*.sqlite3",
]

[testing]
runner = "pytest"
arguments = ["-v", "--cov=src/app", "--cov-report=html", "--cov-report=term-missing"]
test_path = "tests"

[packaging]
package_name = "{{ project_name }}"
package_version = "0.1.0"
build_backend = "hatchling"
include_package_data = true

[logging]
level = "INFO"
format = "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
file = "logs/cli.log"
console = true