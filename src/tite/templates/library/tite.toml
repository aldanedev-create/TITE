# Tite Library Configuration
# This file is automatically generated by Tite

[project]
# Project metadata
name = "{{ project_name }}"
package_name = "{{ package_name }}"
version = "0.1.0"
description = "{{ project_description }}"
author = "{{ author_name }}"
email = "{{ author_email }}"
python_version = ">=3.9"

[project.dependencies]
# List your library dependencies here
# These will be added to pyproject.toml
# Example:
# requests = ">=2.31.0"
# click = ">=8.0.0"

[dev]
# Development server configuration (for example apps)
command = "python -m {{ package_name }}"
port = 8000
host = "127.0.0.1"

[watcher]
# File watching configuration for development
paths = ["src", "tests"]
extensions = [".py", ".pyc"]
ignore = [
    ".venv",
    "__pycache__",
    "*.egg-info",
    "docs/_build",
]
debounce = 100

[clean]
# What to remove when running 'tite clean'
include = [
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    ".hypothesis",
    ".tox",
    ".nox",
    "build",
    "dist",
    "*.egg-info",
    "*.pyc",
    "*.pyo",
    "*.pyd",
    "*.so",
    "*.log",
    "*.pid",
    "*.pid.lock",
    "docs/_build",
]
exclude = [
    ".venv",
    "venv",
]

[git]
# Git configuration
init = true
remote_url = "https://github.com/{{ github_username }}/{{ project_name }}.git"
branch = "main"
ignore_patterns = [
    ".venv",
    "__pycache__",
    "*.pyc",
    ".env",
    ".env.local",
    "dist",
    "build",
    "*.egg-info",
    "*.log",
    "*.db",
    "*.sqlite",
    "*.sqlite3",
    "docs/_build",
]

[testing]
# Testing configuration
runner = "pytest"
arguments = ["-v", "--cov={{ package_name }}", "--cov-report=html"]
test_path = "tests"

[packaging]
# Packaging configuration
package_name = "{{ package_name }}"
package_version = "0.1.0"
build_backend = "hatchling"
publish_command = "twine upload dist/*"

[docs]
# Documentation configuration
builder = "sphinx"
source_dir = "docs"
build_dir = "docs/_build"
format = "html"

[logging]
# Logging configuration
level = "INFO"
format = "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
file = "logs/app.log"
console = true

[ci]
# CI/CD configuration
providers = ["github-actions", "gitlab-ci"]
test_python_versions = ["3.9", "3.10", "3.11", "3.12", "3.13"]
os = ["ubuntu-latest", "windows-latest", "macos-latest"]

[coverage]
# Code coverage configuration
threshold = 80
report_formats = ["html", "xml", "json"]

[release]
# Release configuration
auto_tag = true
bump_version = true
changelog_update = true