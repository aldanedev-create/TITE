[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tite-Sc"
description = "A Zero-Configuration Python Project Bootstrapper for Modern Software Development"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Aldane Hutchinson", email = "aldanehutchinson5@gmail.com"},
]
maintainers = [
    {name = "Aldane Hutchinson", email = "aldanehutchinson5@gmail.com"},
]
keywords = [
    "bootstrapper",
    "project-generator",
    "python",
    "scaffolding",
    "cli",
    "development",
    "automation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.0.0",
    "rich>=13.0.0",
    "watchdog>=3.0.0",
    "pathspec>=0.11.0",
    "colorama>=0.4.6",
    "tomli>=2.0.0; python_version < '3.11'",
    "python-dotenv>=1.0.0",
    "questionary>=2.0.0",
    "jinja2>=3.1.0",
    "loguru>=0.7.0",
    "pyyaml>=6.0.0",
    "requests>=2.31.0",
]
dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "black>=22.0.0",
    "isort>=5.10.0",
    "flake8>=6.0.0",
    "pre-commit>=3.0.0",
    "build>=0.10.0",
    "twine>=4.0.0",
    "types-PyYAML>=6.0.0",
    "types-requests>=2.31.0",
]
modes = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "jupyter>=1.0.0",
    "matplotlib>=3.7.0",
    "scikit-learn>=1.2.0",
    "openai>=1.0.0",
    "langchain>=0.3.0",
    "transformers>=4.30.0",
    "torch>=2.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "psutil>=5.9.0",  
]

[project.urls]
Homepage = "https://github.com/aldanedev-create/TITE"
Repository = "https://github.com/aldanedev-create/TITE"
Documentation = "https://github.com/aldanedev-create/TITE#readme"
Issues = "https://github.com/aldanedev-create/TITE/issues"
Changelog = "https://github.com/aldanedev-create/TITE/blob/main/CHANGELOG.md"


[project.scripts]
tite = "tite.cli.app:main"

[tool.hatch.version]
path = "src/tite/__init__.py"
pattern = "__version__ = \"(?P<version>[^\"]+)\""

[tool.hatch.build.targets.wheel]
packages = ["src/tite"]
artifacts = [
  "templates/**",
]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "CODE_OF_CONDUCT.md",
    "SECURITY.md",
    "MANIFEST.in",
    "pyproject.toml",
]

[tool.black]
line-length = 88
target-version = ["py39", "py310", "py311", "py312", "py313"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | \.pytest_cache
  | _build
  | buck-out
  | build
  | dist
  | site-packages
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_gitignore = true

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = false
disallow_untyped_defs = true
disallow_any_unimported = false
strict_optional = true
show_error_codes = true
error_summary = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
files = ["src", "tests"]
exclude = [
    "build",
    "dist",
    ".venv",
    "__pycache__",
    "*.egg-info",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "-ra",
    "-q",
    "--strict-config",
    "--strict-markers",
    "--cov=src/tite",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-branch",
]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
    "cli: CLI tests",
    "core: Core functionality tests",
    "modes: Mode system tests",
]

[tool.coverage.run]
source = ["src/tite"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
ignore_errors = true

[tool.bandit]
targets = ["src/"]
skips = ["B101", "B311"]
severity = "medium"

[tool.pre-commit-config]
repos = [
    {repo = "https://github.com/pre-commit/pre-commit-hooks", rev = "v4.5.0", hooks = [
        {id = "trailing-whitespace"},
        {id = "end-of-file-fixer"},
        {id = "check-yaml"},
        {id = "check-added-large-files"},
        {id = "check-json"},
        {id = "check-toml"},
        {id = "check-case-conflict"},
        {id = "fix-byte-order-marker"},
        {id = "mixed-line-ending"},
    ]},
    {repo = "https://github.com/psf/black", rev = "24.1.0", hooks = [
        {id = "black"},
    ]},
    {repo = "https://github.com/pycqa/isort", rev = "5.13.0", hooks = [
        {id = "isort", args = ["--profile", "black"]},
    ]},
    {repo = "https://github.com/pycqa/flake8", rev = "7.0.0", hooks = [
        {id = "flake8", args = ["--max-line-length=88", "--extend-ignore=E203,W503"]},
    ]},
    {repo = "https://github.com/pre-commit/mirrors-mypy", rev = "v1.8.0", hooks = [
        {id = "mypy", args = ["--ignore-missing-imports"]},
    ]},
    {repo = "https://github.com/PyCQA/bandit", rev = "1.7.8", hooks = [
        {id = "bandit", args = ["-r", "--severity-level", "medium"]},
    ]},
]