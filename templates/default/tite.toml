# Tite Project Configuration
# This file is automatically generated by Tite

[project]
# Project metadata
name = "{{ project_name }}"
version = "0.1.0"
description = "{{ project_description }}"
author = "{{ author_name }}"
email = "{{ author_email }}"
python_version = ">=3.12"

[project.dependencies]
# List your production dependencies here
# These will be added to pyproject.toml
# Example:
# click = ">=8.0.0"
# rich = ">=13.0.0"

[dev]
# Development server configuration
command = "python src/main.py"
port = 8000
host = "127.0.0.1"
env_file = ".env"
env_prefix = "APP_"

[watcher]
# File watching configuration for development
# This is used by 'tite dev' command
paths = ["src", "tests"]
extensions = [".py", ".pyc"]
ignore = [
    ".venv",
    "__pycache__",
    "*.egg-info",
    "logs",
    "*.log",
]
debounce = 100  # milliseconds
restart_on_change = true

[clean]
# What to remove when running 'tite clean'
include = [
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    ".hypothesis",
    ".tox",
    ".nox",
    "build",
    "dist",
    "*.egg-info",
    "*.pyc",
    "*.pyo",
    "*.pyd",
    "*.so",
    "*.log",
    "*.pid",
    "*.pid.lock",
]
exclude = [
    ".venv",
    "venv",
]

[git]
# Git configuration
init = true
remote_url = ""
branch = "main"
ignore_patterns = [
    ".venv",
    "__pycache__",
    "*.pyc",
    ".env",
    ".env.local",
    "dist",
    "build",
    "*.egg-info",
    "*.log",
    "*.db",
    "*.sqlite",
    "*.sqlite3",
]

[environment]
# Environment variables template
variables = [
    "DATABASE_URL=sqlite:///app.db",
    "DEBUG=true",
    "LOG_LEVEL=INFO",
    "SECRET_KEY=your-secret-key-here",
]
env_file = ".env"

[testing]
# Testing configuration
runner = "pytest"
arguments = ["-v", "--cov=src", "--cov-report=html"]
test_path = "tests"

[packaging]
# Packaging configuration
package_name = "{{ project_name }}"
package_version = "0.1.0"
build_backend = "hatchling"

[docs]
# Documentation configuration
builder = "sphinx"
source_dir = "docs"
build_dir = "docs/_build"
format = "html"

[logging]
# Logging configuration
level = "INFO"
format = "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
file = "logs/app.log"
console = true

[databases]
# Database configuration (if needed)
default = "sqlite:///app.db"
# For PostgreSQL:
# postgresql = "postgresql://user:password@localhost/dbname"
# For MySQL:
# mysql = "mysql://user:password@localhost/dbname"

[api]
# API configuration (if building an API)
prefix = "/api/v1"
cors_allowed_origins = ["*"]
cors_allow_credentials = true
cors_allow_methods = ["*"]
cors_allow_headers = ["*"]

[security]
# Security configuration
ssl_cert = ""
ssl_key = ""
allowed_hosts = ["localhost", "127.0.0.1"]
csrf_protection = true
rate_limit = "100/hour"

[cache]
# Cache configuration
backend = "simple"  # simple, redis, memcache
ttl = 300  # seconds
redis_url = "redis://localhost:6379/0"

[workers]
# Worker configuration for background tasks
type = "thread"  # thread, process, async
pool_size = 4
max_workers = 10

[monitoring]
# Monitoring and observability
enabled = false
metrics_path = "/metrics"
health_check_path = "/health"
debug_mode = false

[email]
# Email configuration (if needed)
smtp_host = "smtp.gmail.com"
smtp_port = 587
smtp_use_tls = true
default_from = "noreply@example.com"