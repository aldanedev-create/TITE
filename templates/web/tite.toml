# Tite Web Application Configuration
# This file is automatically generated by Tite

[project]
# Project metadata
name = "{{ project_name }}"
version = "0.1.0"
description = "{{ project_description }}"
author = "{{ author_name }}"
email = "{{ author_email }}"
python_version = ">=3.9"

[project.dependencies]
# Web framework - choose one:
# fastapi = ">=0.104.0"
# flask = ">=2.3.0"
# django = ">=4.2.0"

# Common web dependencies
python-dotenv = ">=1.0.0"
click = ">=8.0.0"
rich = ">=13.0.0"
watchdog = ">=3.0.0"

[dev]
# Development server configuration
command = "python src/main.py"
port = 8000
host = "127.0.0.1"
env_file = ".env"
env_prefix = ""

[watcher]
# File watching configuration
paths = ["src", "tests"]
extensions = [".py", ".html", ".css", ".js", ".json", ".yaml", ".yml", ".toml"]
ignore = [
    ".venv",
    "__pycache__",
    "*.egg-info",
    "logs",
    "*.log",
    "static",
    "build",
    "dist",
]
debounce = 100
restart_on_change = true

[clean]
# What to remove when running 'tite clean'
include = [
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    ".hypothesis",
    ".tox",
    ".nox",
    "build",
    "dist",
    "*.egg-info",
    "*.pyc",
    "*.pyo",
    "*.pyd",
    "*.so",
    "*.log",
    "*.pid",
    "*.pid.lock",
]
exclude = [
    ".venv",
    "venv",
    "static",
    "node_modules",
]

[git]
# Git configuration
init = true
remote_url = "https://github.com/{{ github_username }}/{{ project_name }}.git"
branch = "main"
ignore_patterns = [
    ".venv",
    "__pycache__",
    "*.pyc",
    ".env",
    ".env.local",
    ".env.*.local",
    "dist",
    "build",
    "*.egg-info",
    "*.log",
    "*.db",
    "*.sqlite",
    "*.sqlite3",
    "node_modules",
    "static",
]

[testing]
# Testing configuration
runner = "pytest"
arguments = ["-v", "--cov=src", "--cov-report=html", "--cov-report=term-missing"]
test_path = "tests"
framework = "pytest"

[packaging]
# Packaging configuration
package_name = "{{ project_name }}"
package_version = "0.1.0"
build_backend = "hatchling"
include_package_data = true

[docs]
# Documentation configuration
builder = "sphinx"
source_dir = "docs"
build_dir = "docs/_build"
format = "html"

[logging]
# Logging configuration
level = "INFO"
format = "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
file = "logs/app.log"
console = true

[web]
# Web-specific configuration
framework = "fastapi"  # fastapi, flask, django
static_dir = "static"
templates_dir = "templates"
middleware = ["cors", "logging"]
cors_enabled = true
cors_allow_origins = ["*"]
session_timeout = 3600

[database]
# Database configuration
enabled = false
engine = "sqlite"  # sqlite, postgresql, mysql, mongodb
url = "sqlite:///app.db"
pool_size = 5
max_overflow = 10

[security]
# Security configuration
csrf_protection = true
session_secure = false
rate_limit_enabled = false
rate_limit = "100/hour"
password_min_length = 8

[deployment]
# Deployment configuration
platform = "auto"  # auto, heroku, vercel, docker
environments = ["development", "staging", "production"]
health_check_path = "/health"
metrics_enabled = true