# Tite API Application Configuration
# This file is automatically generated by Tite

[project]
name = "{{ project_name }}"
version = "0.1.0"
description = "{{ project_description }}"
author = "{{ author_name }}"
email = "{{ author_email }}"
python_version = ">=3.9"

[dev]
command = "python src/main.py"
port = 8000
host = "127.0.0.1"
env_file = ".env"
env_prefix = ""

[watcher]
paths = ["src", "tests"]
extensions = [".py", ".json", ".yaml", ".yml", ".toml"]
ignore = [
    ".venv",
    "__pycache__",
    "*.egg-info",
    "logs",
    "*.log",
    "build",
    "dist",
]
debounce = 100
restart_on_change = true

[clean]
include = [
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    ".hypothesis",
    ".tox",
    ".nox",
    "build",
    "dist",
    "*.egg-info",
    "*.pyc",
    "*.pyo",
    "*.pyd",
    "*.so",
    "*.log",
    "*.pid",
    "*.pid.lock",
]
exclude = [
    ".venv",
    "venv",
]

[git]
init = true
remote_url = "https://github.com/{{ github_username }}/{{ project_name }}.git"
branch = "main"
ignore_patterns = [
    ".venv",
    "__pycache__",
    "*.pyc",
    ".env",
    ".env.local",
    ".env.*.local",
    "dist",
    "build",
    "*.egg-info",
    "*.log",
    "*.db",
    "*.sqlite",
    "*.sqlite3",
]

[testing]
runner = "pytest"
arguments = ["-v", "--cov=src", "--cov-report=html", "--cov-report=term-missing"]
test_path = "tests"

[packaging]
package_name = "{{ project_name }}"
package_version = "0.1.0"
build_backend = "hatchling"
include_package_data = true

[logging]
level = "INFO"
format = "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
file = "logs/api.log"
console = true

[api]
framework = "fastapi"
api_prefix = "/api/v1"
version = "0.1.0"
cors_enabled = true
cors_origins = ["*"]
rate_limit_enabled = true
rate_limit = "100/hour"
jwt_enabled = false

[database]
enabled = false
engine = "sqlite"
url = "sqlite:///app.db"
pool_size = 5
max_overflow = 10

[deployment]
platform = "docker"
environments = ["development", "staging", "production"]
health_check_path = "/health"
metrics_enabled = true
container_port = 8000